# The server image (`Dockerfile`: the sync server serving the web app).
#
# - Tags: `release.yml` calls this workflow for every `v*` tag. It builds linux/amd64 and
#   linux/arm64 and pushes `ghcr.io/<owner>/<repo>` tagged `X.Y.Z`, `X.Y`, `X` (from 1.0 on) and
#   `latest` (stable releases only), with provenance and an SBOM.
# - Manual runs: the same, optionally pushed (tagged with the branch and commit).
# - Pull requests that touch the image: an amd64 build that is never pushed.
#
# Layers are cached in the GitHub Actions cache. Pushing uses GITHUB_TOKEN (`packages: write`).
name: Docker

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR
        type: boolean
        default: false
  workflow_call:
    inputs:
      push:
        type: boolean
        default: true
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'apps/server/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GHCR image names must be lowercase, and repository names may not be.
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Platforms
        id: platforms
        env:
          PUSH: ${{ inputs.push == true }}
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: inputs.push == true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
          labels: |
            org.opencontainers.image.title=Tessera
            org.opencontainers.image.description=Local-first knowledge app: sync server and web app
            org.opencontainers.image.licenses=MIT
      - name: Build${{ inputs.push == true && ' and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ inputs.push == true && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push == true }}
