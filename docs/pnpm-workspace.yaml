# The docs site is its own pnpm project with its own lockfile. The root workspace only covers
# apps/* and packages/*, so this file makes `pnpm install` here independent of the monorepo:
#   pnpm --dir docs install && pnpm --dir docs build
packages:
  - '.'

allowBuilds:
  esbuild: true

# VitePress 1.6.4 (the latest stable) asks for Vite 5, whose dev server has advisories fixed only
# in Vite 6.4.3 (and esbuild 0.25). VitePress 1.6 builds and serves on Vite 6; drop this override
# for VitePress 2 once it's stable.
overrides:
  vite: 6.4.3
